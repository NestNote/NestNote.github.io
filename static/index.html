<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="metaThemeColor" content="#EEF3FC" />
  <meta name="description" content="NestNote — Calm family fever, medicine &amp; hydration diary." />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <title>NestNote — Family Fever &amp; Care Diary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tabular { font-variant-numeric: tabular-nums; }

    /* =====================================================================
     * 6 ORIGINAL NESTNOTE COLOR PALETTES
     * ===================================================================== */

    /* 1. Cerulean Silk */
    [data-theme="cerulean"] {
      --bg: #EEF3FC;
      --outer: #E4ECFA;
      --ambient: radial-gradient(95% 42% at 50% 0%, rgba(91, 138, 245, 0.24) 0%, rgba(238, 243, 252, 0) 100%);
      --card: rgba(255, 255, 255, 0.88);
      --card-solid: #FFFFFF;
      --soft: #E3ECFB;
      --border: rgba(42, 82, 200, 0.10);
      --ink: #121C36;
      --muted: #607096;
      --brand: #3563E9;
      --brand-soft: rgba(53, 99, 233, 0.13);
      --med: #7A5AF8;
      --med-soft: rgba(122, 90, 248, 0.13);
      --water: #0EA5E9;
      --water-soft: rgba(14, 165, 233, 0.14);
      --water-fill: rgba(14, 165, 233, 0.16);
      --warn: #D97706;
      --danger: #DC3E55;
      --dock: rgba(255, 255, 255, 0.86);
      --sheet: #FFFFFF;
      --cta-bg: #141F3D;
      --cta-ink: #FFFFFF;
      --shadow: 0 10px 30px rgba(34, 66, 156, 0.08);
    }

    /* 2. Pistachio Milk */
    [data-theme="pistachio"] {
      --bg: #EFF4E8;
      --outer: #E5ECDC;
      --ambient: radial-gradient(95% 42% at 50% 0%, rgba(114, 178, 86, 0.24) 0%, rgba(239, 244, 232, 0) 100%);
      --card: rgba(255, 255, 255, 0.88);
      --card-solid: #FFFFFF;
      --soft: #E4EDD8;
      --border: rgba(58, 112, 45, 0.10);
      --ink: #192616;
      --muted: #62755B;
      --brand: #488636;
      --brand-soft: rgba(72, 134, 54, 0.13);
      --med: #6C63E6;
      --med-soft: rgba(108, 99, 230, 0.13);
      --water: #0EA5E9;
      --water-soft: rgba(14, 165, 233, 0.14);
      --water-fill: rgba(14, 165, 233, 0.16);
      --warn: #C97610;
      --danger: #D64545;
      --dock: rgba(255, 255, 255, 0.86);
      --sheet: #FFFFFF;
      --cta-bg: #1C2E18;
      --cta-ink: #FFFFFF;
      --shadow: 0 10px 30px rgba(48, 92, 36, 0.08);
    }

    /* 3. Butter Honey */
    [data-theme="honey"] {
      --bg: #FAF4E6;
      --outer: #F3EAD6;
      --ambient: radial-gradient(95% 42% at 50% 0%, rgba(238, 175, 62, 0.28) 0%, rgba(250, 244, 230, 0) 100%);
      --card: rgba(255, 255, 255, 0.90);
      --card-solid: #FFFFFF;
      --soft: #F3E6C8;
      --border: rgba(154, 98, 18, 0.11);
      --ink: #291D0D;
      --muted: #806B4D;
      --brand: #C6750C;
      --brand-soft: rgba(198, 117, 12, 0.14);
      --med: #7A5CD6;
      --med-soft: rgba(122, 92, 214, 0.13);
      --water: #0EA5E9;
      --water-soft: rgba(14, 165, 233, 0.14);
      --water-fill: rgba(14, 165, 233, 0.16);
      --warn: #C6750C;
      --danger: #D14343;
      --dock: rgba(255, 252, 244, 0.88);
      --sheet: #FFFFFF;
      --cta-bg: #2E1F0B;
      --cta-ink: #FFFFFF;
      --shadow: 0 10px 30px rgba(154, 98, 18, 0.08);
    }

    /* 4. Rosewood Dusk */
    [data-theme="rosewood"] {
      --bg: #F7EFF2;
      --outer: #EFE4E8;
      --ambient: radial-gradient(95% 42% at 50% 0%, rgba(192, 102, 138, 0.24) 0%, rgba(247, 239, 242, 0) 100%);
      --card: rgba(255, 255, 255, 0.88);
      --card-solid: #FFFFFF;
      --soft: #EFE0E6;
      --border: rgba(126, 54, 86, 0.10);
      --ink: #29161F;
      --muted: #7E606E;
      --brand: #9E4469;
      --brand-soft: rgba(158, 68, 105, 0.13);
      --med: #6D58C9;
      --med-soft: rgba(109, 88, 201, 0.13);
      --water: #0EA5E9;
      --water-soft: rgba(14, 165, 233, 0.14);
      --water-fill: rgba(14, 165, 233, 0.16);
      --warn: #C97614;
      --danger: #C9364E;
      --dock: rgba(255, 250, 252, 0.88);
      --sheet: #FFFFFF;
      --cta-bg: #2E1521;
      --cta-ink: #FFFFFF;
      --shadow: 0 10px 30px rgba(122, 50, 82, 0.08);
    }

    /* 5. Espresso Gold (Warm Zero-Blue-Light Night) */
    [data-theme="espresso"] {
      --bg: #0E0B09;
      --outer: #080605;
      --ambient: radial-gradient(95% 42% at 50% 0%, rgba(230, 184, 106, 0.22) 0%, rgba(14, 11, 9, 0) 100%);
      --card: rgba(30, 24, 20, 0.88);
      --card-solid: #1E1814;
      --soft: rgba(245, 222, 186, 0.09);
      --border: rgba(230, 184, 106, 0.14);
      --ink: #FCF6EC;
      --muted: rgba(242, 226, 202, 0.62);
      --brand: #E6B86A;
      --brand-soft: rgba(230, 184, 106, 0.17);
      --med: #C49BFF;
      --med-soft: rgba(196, 155, 255, 0.17);
      --water: #38BDF8;
      --water-soft: rgba(56, 189, 248, 0.16);
      --water-fill: rgba(56, 189, 248, 0.20);
      --warn: #F5B841;
      --danger: #F2727D;
      --dock: rgba(28, 22, 18, 0.88);
      --sheet: #201A16;
      --cta-bg: #E6B86A;
      --cta-ink: #1A120A;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    /* 6. Slate Iris (Cool Twilight Night) */
    [data-theme="slateiris"] {
      --bg: #0A0D16;
      --outer: #05070C;
      --ambient: radial-gradient(95% 42% at 50% 0%, rgba(142, 128, 255, 0.25) 0%, rgba(10, 13, 22, 0) 100%);
      --card: rgba(22, 27, 45, 0.88);
      --card-solid: #161B2D;
      --soft: rgba(210, 218, 255, 0.09);
      --border: rgba(167, 155, 255, 0.15);
      --ink: #F4F6FF;
      --muted: rgba(214, 222, 255, 0.62);
      --brand: #A79BFF;
      --brand-soft: rgba(167, 155, 255, 0.18);
      --med: #7DD3FC;
      --med-soft: rgba(125, 211, 252, 0.16);
      --water: #38BDF8;
      --water-soft: rgba(56, 189, 248, 0.16);
      --water-fill: rgba(56, 189, 248, 0.20);
      --warn: #FBBF24;
      --danger: #FB7185;
      --dock: rgba(20, 25, 42, 0.88);
      --sheet: #191F34;
      --cta-bg: #A79BFF;
      --cta-ink: #101326;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
    }

    body {
      background-color: var(--outer);
      color: var(--ink);
    }
    .app-shell {
      min-height: 100dvh;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      background-color: var(--bg);
      background-image: var(--ambient);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 520px) {
      .app-shell {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.12);
      }
    }

    .glass-card {
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .soft-pill { background: var(--soft); }

    /* Horizontal Physical Glass-Bulb Thermometer Fixator */
    .thermo-body {
      position: relative;
      display: flex;
      align-items: center;
      user-select: none;
      touch-action: none;
      cursor: ew-resize;
    }
    .thermo-bulb {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      border: 3px solid var(--card-solid);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18), inset -3px -4px 8px rgba(0, 0, 0, 0.18);
      transition: background 0.15s ease;
    }
    .thermo-bulb::after {
      content: "";
      position: absolute;
      top: 7px;
      left: 8px;
      width: 13px;
      height: 9px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.58);
      transform: rotate(-28deg);
    }
    .thermo-stem-outer {
      flex: 1;
      height: 28px;
      margin-left: -12px;
      padding: 4px 6px 4px 10px;
      border-radius: 0 9999px 9999px 0;
      background: var(--card-solid);
      border: 1.5px solid var(--border);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.10);
      position: relative;
      display: flex;
      align-items: center;
    }
    .thermo-capillary {
      position: relative;
      width: 100%;
      height: 14px;
      border-radius: 9999px;
      background: var(--soft);
      overflow: visible;
    }
    .thermo-mercury {
      height: 100%;
      border-radius: 9999px;
      position: relative;
      transition: background 0.15s ease;
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.35);
    }
    .thermo-knob {
      position: absolute;
      right: -11px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      border: 3px solid currentColor;
    }
    .thermo-sheen {
      position: absolute;
      top: 3px;
      left: 12px;
      right: 12px;
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.42);
      pointer-events: none;
    }
    .mini-thermo-bulb {
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      border: 2.5px solid var(--card-solid);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
    }
    .mini-thermo-bulb::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 5px;
      width: 8px;
      height: 5px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.65);
      transform: rotate(-28deg);
    }

    @keyframes nestBreathe {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.12); opacity: 0.12; }
    }
    .nest-halo { animation: nestBreathe 2.8s ease-in-out infinite; }

    @keyframes loadFill {
      0% { width: 10%; }
      65% { width: 78%; }
      100% { width: 100%; }
    }
    .nest-loader-fill { animation: loadFill 1.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }

    .sheet-bg {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sheet-bg.open { opacity: 1; pointer-events: auto; }
    .sheet-box {
      transform: translateY(100%);
      transition: transform 0.26s cubic-bezier(0.15, 0.5, 0.5, 1);
    }
    .sheet-bg.open .sheet-box { transform: translateY(0); }

    .print-only { display: none; }
    @media print {
      @page { margin: 14mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      #dockWrap, #toast, #sheetBg, .no-print { display: none !important; }
      .print-only { display: block !important; }
      body, .app-shell {
        background: #FFFFFF !important;
        background-image: none !important;
        color: #111827 !important;
        max-width: 100% !important;
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        border: none !important;
      }
      .glass-card {
        background: #FFFFFF !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: 1px solid #CBD5E1 !important;
        box-shadow: none !important;
        border-radius: 16px !important;
        break-inside: avoid;
      }
      .soft-pill {
        background: #F8FAFC !important;
        border: 1px solid #E2E8F0 !important;
      }
      .print-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
      .print-pad-0 { padding: 0 !important; }
    }
  </style>
</head>
<body data-theme="cerulean">
  <div id="app" class="app-shell">
    <!-- Floating Toast -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-[408px] z-50 px-4 py-3 rounded-2xl shadow-lg text-xs font-semibold flex items-center justify-between gap-3 transition-all duration-200 opacity-0 -translate-y-2 pointer-events-none" style="background: var(--cta-bg); color: var(--cta-ink);">

      <button id="toastUndo" onclick="undoDelete()" class="hidden text-xs font-bold underline cursor-pointer">Undo</button>

    <!-- Active Screen -->

<script>
const STORAGE_KEY = 'nestnote_state_v2';
const ACCOUNTS_KEY = 'nestnote_accounts_v1';

const THEMES = [
  { id: 'cerulean', name: 'Cerulean Silk', desc: 'Cornflower & sky', dark: false, accent: '#3563E9', metaBg: '#EEF3FC', swatch: 'linear-gradient(135deg,#2A52C8,#89B2FF)' },
  { id: 'pistachio', name: 'Pistachio Milk', desc: 'Botanical sage', dark: false, accent: '#488636', metaBg: '#EFF4E8', swatch: 'linear-gradient(135deg,#3A702D,#9ED082)' },
  { id: 'honey', name: 'Butter Honey', desc: 'Warm marigold', dark: false, accent: '#C6750C', metaBg: '#FAF4E6', swatch: 'linear-gradient(135deg,#B5640B,#F5C55E)' },
  { id: 'rosewood', name: 'Rosewood Dusk', desc: 'Dusty mauve & fig', dark: false, accent: '#9E4469', metaBg: '#F7EFF2', swatch: 'linear-gradient(135deg,#7A3252,#DA92B0)' },
  { id: 'espresso', name: 'Espresso Gold', desc: 'Warm cocoa dark', dark: true, accent: '#C99748', metaBg: '#0E0B09', swatch: 'linear-gradient(135deg,#1C1714,#E6B86A)' },
  { id: 'slateiris', name: 'Slate Iris', desc: 'Twilight lilac dark', dark: true, accent: '#7D6DF2', metaBg: '#0A0D16', swatch: 'linear-gradient(135deg,#151A2B,#A79BFF)' }
];

function validThemeId(id) {
  return THEMES.some(t => t.id === id) ? id : 'cerulean';
}

function generateFamilyCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = 'NEST-';
  for (let i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

const defaultState = {
  view: 'loading',
  signedIn: false,
  isGuest: false,
  token: '',
  localUser: '',
  authMode: 'signin',
  theme: 'cerulean',
  unit: 'metric',
  tab: 'today',
  childId: null,
  showAll: false,
  alarmOn: true,
  userName: '',
  familyCode: generateFamilyCode(),
  children: [],
  busy: false
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...defaultState };
    const parsed = JSON.parse(raw);
    return {
      ...defaultState,
      ...parsed,
      theme: validThemeId(parsed.theme),
      view: 'loading',
      busy: false
    };
  } catch {
    return { ...defaultState };
  }
}

const state = loadState();
let lastDeleted = null;

function loadLocalAccounts() {
  try {
    const raw = localStorage.getItem(ACCOUNTS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {};
  }
}

function saveLocalAccounts(accounts) {
  try {
    localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
  } catch {}
}

async function hashLocalPassword(pass) {
  const input = 'nestnote_local_v1:' + String(pass || '');
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch {}
  let h1 = 0x811c9dc5, h2 = 0x811c9dc5;
  for (let i = 0; i < input.length; i++) {
    const c = input.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619);
    h2 = Math.imul(h2 ^ (c + i), 2246822519);
  }
  return 'fb_' + (h1 >>> 0).toString(16) + '_' + (h2 >>> 0).toString(16);
}

async function localRegister({ name, username, password }) {
  const u = username.trim().toLowerCase();
  const accounts = loadLocalAccounts();
  if (accounts[u]) {
    return { ok: false, message: 'An account with this email or username already exists. Try Sign In.' };
  }
  const passHash = await hashLocalPassword(password);
  const acc = {
    id: 'lu_' + Date.now(),
    username: u,
    name: name.trim(),
    passHash,
    theme: state.theme,
    unit: state.unit,
    alarmOn: state.alarmOn,
    childId: null,
    children: [],
    createdAt: new Date().toISOString()
  };
  accounts[u] = acc;
  saveLocalAccounts(accounts);
  return { ok: true, user: acc, children: [] };
}

async function localLogin({ username, password }) {
  const u = username.trim().toLowerCase();
  const accounts = loadLocalAccounts();
  const acc = accounts[u];
  const passHash = await hashLocalPassword(password);
  if (!acc || acc.passHash !== passHash) {
    return { ok: false, message: 'Invalid email/username or password' };
  }
  return { ok: true, user: acc, children: Array.isArray(acc.children) ? acc.children : [] };
}

function persist() {
  try {
    const { view, busy, ...toSave } = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    if (state.localUser && !state.token) {
      const accounts = loadLocalAccounts();
      if (accounts[state.localUser]) {
        accounts[state.localUser].children = state.children;
        accounts[state.localUser].childId = state.childId;
        accounts[state.localUser].theme = state.theme;
        accounts[state.localUser].unit = state.unit;
        accounts[state.localUser].alarmOn = state.alarmOn;
        saveLocalAccounts(accounts);
      }
    }
  } catch {}
}

const SKIN_OPTIONS = [
  'Normal / Pink',
  'Flushed / Red',
  'Pale',
  'Rash / Spots',
  'Sweaty / Clammy',
  'Dry / Cool',
  'Mottled / Marbled',
  'Hives / Welts'
];

const SLEEP_QUALITIES = ['Calm', 'Restless', 'Woke up often', 'Hard to fall asleep'];
const FOOD_APPETITES = ['Ate well', 'Small bite', 'Refused food'];
const DIAPER_TYPES = [
  { id: 'wet', label: 'Wet (pee)' },
  { id: 'stool', label: 'Stool' },
  { id: 'both', label: 'Both' }
];
const STOOL_OPTIONS = ['Normal', 'Soft', 'Loose / Diarrhea', 'Hard'];
const BREATHING_OPTIONS = ['Clear', 'Dry cough', 'Wet cough', 'Wheezing', 'Runny / stuffy nose', 'Fast breathing'];

const draft = {
  tempC: 37.0,
  medName: '', medUnit: 'ml', dose: 5.0,
  ml: 120, wet: false,
  comment: '', photo: '',
  skinSelected: [], skinCustom: '',
  sleepHours: 1.5, sleepQuality: 'Calm',
  foodAppetite: 'Ate well', foodText: '',
  diaperType: 'wet', stool: 'Normal',
  breathingTags: [], respRate: 0,
  bpm: 95,
  customName: '', customVal: '', customUnit: ''
};
const authForm = { name: '', user: '', pass: '', error: '', badFields: new Set() };
const setupForm = { name: '', age: '', weight: '', allergies: '', doctor: '', joinCode: '', error: '', badFields: new Set() };
let familyJoinInput = '';

// ==================== API HELPER & NORMALIZATION ====================
const RENDER_BACKEND = 'https://nestnote-app.onrender.com';
const API_BASE = (window.location.hostname === 'nestnote.github.io') ? RENDER_BACKEND : '';

async function apiCall(method, url, body) {
  const fullUrl = url.startsWith('http') ? url : (API_BASE + url);
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const opts = { method, headers };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(fullUrl, opts);
  const ct = (res.headers.get('content-type') || '').toLowerCase();
  const isApiJson = ct.includes('application/json');
  let json = {};
  if (isApiJson) {
    try { json = await res.json(); } catch {}
  }
  return { ok: isApiJson && res.ok && json.success !== false, status: res.status, isApiJson, data: json.data, message: json.message || '' };
}

function fmtHHMMFromMs(ms) {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function parseMlFromText(txt) {
  const m = String(txt || '').match(/(\d+(?:\.\d+)?)\s*ml/i);
  return m ? Number(m[1]) : 100;
}

function dailyWaterGoalMl(ageYr, weightKg) {
  const a = Number(ageYr);
  if (a > 0) {
    if (a < 0.5) return 700;
    if (a < 1) return 800;
    if (a < 2) return 1000;
    if (a < 4) return 1200;
    if (a < 6) return 1400;
    if (a < 9) return 1600;
    if (a < 12) return 1900;
    if (a < 14) return 2100;
    return 2400;
  }
  const w = Number(weightKg) || 12;
  return w <= 10 ? Math.round(w * 100) : Math.round(1000 + (w - 10) * 50);
}

function isFamilyChild(c) {
  if (!c) return false;
  if (Array.isArray(c.familyMembers) && c.familyMembers.length > 1) return true;
  const authors = new Set((c.entries || []).map(e => e.author).filter(Boolean));
  return authors.size > 1;
}

function waterGoalPreviewHtml(ageVal) {
  const a = parseFloat(ageVal);
  if (!(a > 0)) return '';
  const ml = dailyWaterGoalMl(a, 0);
  return `<div class="rounded-2xl px-3.5 py-2.5 flex items-center justify-between text-xs font-semibold" style="background: var(--water-soft); color: var(--water);">
    <span class="flex items-center gap-1.5"><svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.7 6.3 10.6a7 7 0 1 0 11.4 0L12 2.7z"/></svg><span>Normal daily water (${a} yr)</span></span>
    <span class="font-bold tabular">${fmtMl(ml)} / day</span>
  </div>`;
}

function updateWaterGoalPreview(elId, ageVal) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = waterGoalPreviewHtml(ageVal);
}

function normalizeServerEntry(p) {
  const VALID_TYPES = ['temp', 'med', 'water', 'note', 'sleep', 'food', 'diaper', 'breathing', 'pulse', 'custom'];
  const type = VALID_TYPES.includes(p.type)
    ? p.type
    : (p.med ? 'med' : (p.drink || p.ml ? 'water' : (p.skin || p.comment ? 'note' : 'temp')));
  const createdAtMs = Number(p.createdAtMs) || 0;
  const time = p.time || (createdAtMs ? fmtHHMMFromMs(createdAtMs) : (p.timestamp || 'Just now'));
  const author = p.author ? String(p.author).trim() : '';
  const comment = p.comment ? String(p.comment).trim() : '';
  const photo = (typeof p.photo === 'string' && p.photo.startsWith('data:image/')) ? p.photo : '';
  const skin = Array.isArray(p.skin)
    ? p.skin.map(s => String(s || '').trim()).filter(Boolean)
    : (p.skin ? [String(p.skin).trim()].filter(Boolean) : []);
  const breathingTags = Array.isArray(p.breathingTags)
    ? p.breathingTags.map(s => String(s || '').trim()).filter(Boolean)
    : [];

  const base = { id: p.id, type, time, author, comment, photo, createdAtMs };

  if (type === 'note') return { ...base, skin, note: p.note || '' };
  if (type === 'sleep') return { ...base, hours: Number(p.hours) || 0, quality: p.quality || 'Calm' };
  if (type === 'food') return { ...base, quality: p.quality || 'Ate well', title: p.title || '' };
  if (type === 'diaper') return { ...base, diaperType: p.diaperType || 'wet', stool: p.stool || '' };
  if (type === 'breathing') return { ...base, breathingTags, respRate: p.respRate ? Number(p.respRate) : null };
  if (type === 'pulse') return { ...base, bpm: Number(p.bpm) || 95 };
  if (type === 'custom') return { ...base, customName: p.customName || p.title || 'Custom', customVal: String(p.customVal ?? ''), customUnit: p.customUnit || '' };
  if (type === 'med') {
    const cleanNote = (p.note && !/^Logged by /i.test(p.note)) ? p.note : '';
    return { ...base, title: p.title || p.med || 'Medicine', dose: p.dose || '', note: cleanNote };
  }
  if (type === 'water') {
    return { ...base, title: p.title || 'Water', ml: Number(p.ml) || parseMlFromText(p.drink), wet: !!p.wet, note: p.note || '' };
  }
  const tempC = Number(p.temp ?? p.tempC ?? 37.0);
  return { ...base, tempC: Number.isNaN(tempC) ? 37.0 : tempC, note: p.note || statusOf(tempC).label };
}

function normalizeServerChild(sc) {
  const rawEntries = Array.isArray(sc.points48h) ? sc.points48h : [];
  const entries = rawEntries
    .map(normalizeServerEntry)
    .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));

  const reminders = (Array.isArray(sc.reminders) ? sc.reminders : []).map(r => ({
    id: r.id,
    text: r.title ?? r.text ?? 'Care task',
    when: r.time ?? r.when ?? 'Today',
    done: !!r.done,
    author: r.author || ''
  }));

  return {
    id: sc.id,
    name: sc.name || 'Child',
    age: Number(sc.age) || 1,
    weightKg: Number(sc.weight ?? sc.weightKg) || 10,
    allergies: sc.allergies || 'None',
    doctor: sc.doctorPhone || sc.doctor || '',
    familyCode: sc.familyCode || '',
    familyMembers: Array.isArray(sc.familyMembers) ? sc.familyMembers : [],
    reminders,
    entries
  };
}

function child() { return state.children.find(c => c.id === state.childId) || state.children[0] || null; }
function temps(c) { return c ? c.entries.filter(e => e.type === 'temp') : []; }
function currentThemeObj() { return THEMES.find(t => t.id === state.theme) || THEMES[0]; }
function esc(str) { return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m])); }
function fmtT(c) {
  const v = state.unit === 'imperial' ? (c * 9 / 5 + 32) : c;
  const [w, d] = v.toFixed(1).split('.');
  const u = state.unit === 'imperial' ? '°F' : '°C';
  return { w, d, u, full: `${w}.${d}${u}` };
}
function fmtW(kg) { return state.unit === 'imperial' ? `${(kg * 2.20462).toFixed(1)} lb` : `${kg.toFixed(1)} kg`; }
function fmtMl(ml) { return state.unit === 'imperial' ? `${(ml / 29.5735).toFixed(1)} oz` : `${Math.round(ml)} ml`; }
function fmtHours(h) {
  const hrs = Math.floor(h);
  const mins = Math.round((h - hrs) * 60);
  if (hrs > 0 && mins > 0) return `${hrs}h ${mins}m`;
  if (hrs > 0) return `${hrs}h`;
  return `${mins}m`;
}

function countDiapers(c) {
  if (!c) return { wet: 0, stool: 0 };
  let wet = 0, stool = 0;
  c.entries.forEach(e => {
    if (e.type === 'water' && e.wet) wet++;
    if (e.type === 'diaper') {
      if (e.diaperType === 'wet' || e.diaperType === 'both') wet++;
      if (e.diaperType === 'stool' || e.diaperType === 'both') stool++;
    }
  });
  return { wet, stool };
}

function savedCustomMetricNames(c) {
  if (!c) return [];
  const seen = new Map();
  c.entries.filter(e => e.type === 'custom' && e.customName).forEach(e => {
    const key = e.customName.toLowerCase();
    if (!seen.has(key)) seen.set(key, { name: e.customName, unit: e.customUnit || '' });
  });
  return Array.from(seen.values()).slice(0, 6);
}

function describeEntry(e, showAuthor) {
  const byTag = (showAuthor && e.author) ? ` · by ${esc(e.author)}` : '';
  const cmtTag = e.comment ? ` · ${esc(e.comment)}` : '';

  if (e.type === 'temp') {
    const st = statusOf(e.tempC);
    return {
      bg: st.hex, icon: ICONS.today, title: 'Temperature',
      sub: `${esc(e.time)} · ${esc(e.note || st.label)}${cmtTag}${byTag}`,
      detail: `${esc(e.note || st.label)}${cmtTag}${byTag}`,
      val: fmtT(e.tempC).full, valColor: st.color
    };
  }
  if (e.type === 'med') {
    return {
      bg: 'var(--med)', icon: ICONS.pill,
      title: `${esc(e.title)}${e.dose ? ' · ' + esc(e.dose) : ''}`,
      sub: `${esc(e.time)}${e.note ? ' · ' + esc(e.note) : ''}${cmtTag}${byTag || (e.author ? ' · by ' + esc(e.author) : '')}`,
      detail: `${esc(e.dose || 'Medicine')}${e.note ? ' · ' + esc(e.note) : ''}${cmtTag}${byTag}`,
      val: esc(e.dose || 'Logged'), valColor: 'var(--ink)'
    };
  }
  if (e.type === 'water') {
    return {
      bg: '#0EA5E9', icon: ICONS.drop,
      title: `${fmtMl(e.ml)} ${esc(e.title || 'Water')}`,
      sub: `${esc(e.time)}${e.wet ? ' · Wet diaper' : ''}${cmtTag}${byTag}`,
      detail: `${e.wet ? 'Wet diaper' : 'Hydration'}${cmtTag}${byTag}`,
      val: `+${fmtMl(e.ml)}`, valColor: 'var(--ink)'
    };
  }
  if (e.type === 'note') {
    const skinStr = (e.skin && e.skin.length) ? e.skin.join(', ') : '';
    return {
      bg: '#D95B82', icon: ICONS.note,
      title: skinStr ? `Skin: ${esc(skinStr)}` : 'Comment',
      sub: `${esc(e.time)}${cmtTag}${byTag}`,
      detail: `${e.comment ? esc(e.comment) : 'Skin observation'}${byTag}`,
      val: skinStr ? 'Skin' : 'Note', valColor: 'var(--ink)'
    };
  }
  if (e.type === 'sleep') {
    return {
      bg: '#6366F1', icon: ICONS.sleep,
      title: `Sleep · ${esc(e.quality || 'Calm')}`,
      sub: `${esc(e.time)}${cmtTag}${byTag}`,
      detail: `${esc(e.quality || 'Calm')}${cmtTag}${byTag}`,
      val: fmtHours(e.hours || 0), valColor: 'var(--ink)'
    };
  }
  if (e.type === 'food') {
    return {
      bg: '#16A34A', icon: ICONS.food,
      title: `Food · ${esc(e.quality || 'Ate well')}`,
      sub: `${esc(e.time)}${e.title ? ' · ' + esc(e.title) : ''}${cmtTag}${byTag}`,
      detail: `${e.title ? esc(e.title) : esc(e.quality || 'Meal')}${cmtTag}${byTag}`,
      val: e.quality === 'Refused food' ? 'Refused' : 'Meal', valColor: 'var(--ink)'
    };
  }
  if (e.type === 'diaper') {
    const lbl = e.diaperType === 'both' ? 'Wet & Stool' : e.diaperType === 'stool' ? 'Stool' : 'Wet (pee)';
    const stoolPart = (e.diaperType !== 'wet' && e.stool) ? ` · ${esc(e.stool)}` : '';
    return {
      bg: '#0D9488', icon: ICONS.diaper,
      title: `Diaper · ${lbl}`,
      sub: `${esc(e.time)}${stoolPart}${cmtTag}${byTag}`,
      detail: `${lbl}${stoolPart}${cmtTag}${byTag}`,
      val: e.diaperType === 'both' ? 'Both' : e.diaperType === 'stool' ? 'Stool' : 'Wet', valColor: 'var(--ink)'
    };
  }
  if (e.type === 'breathing') {
    const tags = (e.breathingTags && e.breathingTags.length) ? e.breathingTags.join(', ') : 'Checked';
    return {
      bg: '#0284C7', icon: ICONS.breathing,
      title: `Breathing · ${esc(tags)}`,
      sub: `${esc(e.time)}${e.respRate ? ` · ${e.respRate} breaths/min` : ''}${cmtTag}${byTag}`,
      detail: `${esc(tags)}${e.respRate ? ` · ${e.respRate}/min` : ''}${cmtTag}${byTag}`,
      val: e.respRate ? `${e.respRate}/min` : 'Logged', valColor: 'var(--ink)'
    };
  }
  if (e.type === 'pulse') {
    return {
      bg: '#E11D48', icon: ICONS.pulse,
      title: 'Pulse',
      sub: `${esc(e.time)}${cmtTag}${byTag}`,
      detail: `Heart rate${cmtTag}${byTag}`,
      val: `${e.bpm} bpm`, valColor: '#E11D48'
    };
  }
  return {
    bg: 'var(--brand)', icon: ICONS.custom,
    title: esc(e.customName || 'Custom'),
    sub: `${esc(e.time)}${cmtTag}${byTag}`,
    detail: `${esc(e.customVal || '')}${e.customUnit ? ' ' + esc(e.customUnit) : ''}${cmtTag}${byTag}`,
    val: `${esc(e.customVal || '')}${e.customUnit ? ' ' + esc(e.customUnit) : ''}`, valColor: 'var(--ink)'
  };
}

function photoPickerHtml() {
  if (draft.photo) {
    return `
      <div class="soft-pill rounded-2xl p-2.5 flex items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-2.5 min-w-0">
          <img src="${draft.photo}" alt="Preview" onclick="openPhotoLightbox(draft.photo)" class="w-11 h-11 rounded-xl object-cover shrink-0 cursor-pointer"/>
          <div class="text-xs font-semibold truncate" style="color: var(--ink);">Photo attached</div>
        </div>
        <button type="button" onclick="removeDraftPhoto()" class="px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer" style="background: var(--card-solid); color: var(--danger);">Remove</button>
      </div>`;
  }
  return `
    <label class="soft-pill rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 mb-4 cursor-pointer">
      <span class="flex items-center gap-2 text-xs font-semibold" style="color: var(--muted);">${ICONS.camera}<span>Add photo (optional)</span></span>
      <span class="text-xs font-bold" style="color: var(--brand);">Choose</span>
      <input type="file" accept="image/*" onchange="handlePhotoInput(this)" class="hidden"/>
    </label>`;
}

function handlePhotoInput(inputEl) {
  const file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 900;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
        else { w = Math.round(w * (maxDim / h)); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      draft.photo = canvas.toDataURL('image/jpeg', 0.72);
      renderSheet();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function removeDraftPhoto() { draft.photo = ''; renderSheet(); }
function openPhotoLightbox(src) {
  if (!src) return;
  const img = document.getElementById('photoLightboxImg');
  const box = document.getElementById('photoLightbox');
  if (img && box) { img.src = src; box.classList.remove('hidden'); }
}
function closePhotoLightbox() {
  const box = document.getElementById('photoLightbox');
  if (box) box.classList.add('hidden');
}
function statusOf(c) {
  if (c >= 39.5) return { label: 'High Fever', color: 'var(--danger)', hex: '#D6384E', mercury: 'linear-gradient(90deg, #F87171 0%, #D6384E 100%)' };
  if (c >= 38.0) return { label: 'Fever', color: 'var(--danger)', hex: '#E05264', mercury: 'linear-gradient(90deg, #FB923C 0%, #E05264 100%)' };
  if (c >= 37.4) return { label: 'Slightly Warm', color: 'var(--warn)', hex: '#D98218', mercury: 'linear-gradient(90deg, #FCD34D 0%, #D98218 100%)' };
  return { label: 'All Calm', color: 'var(--brand)', hex: currentThemeObj().accent, mercury: `linear-gradient(90deg, #6EE7B7 0%, ${currentThemeObj().accent} 100%)` };
}
function toast(msg, showUndo = false) {
  const el = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  const undoBtn = document.getElementById('toastUndo');
  if (showUndo) undoBtn.classList.remove('hidden'); else undoBtn.classList.add('hidden');
  el.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => el.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none'), showUndo ? 4500 : 2600);
}

function renderToday() {
  const c = child();
  if (!c) return renderEmptyChildPrompt();
  const tList = temps(c);
  const latest = tList[0];
  const hasTemp = !!latest;
  const curC = latest ? latest.tempC : 36.6;
  const peakC = hasTemp ? Math.max(...tList.map(x => x.tempC)) : null;
  const t = hasTemp ? fmtT(curC) : { w: '--', d: '-', u: state.unit === 'imperial' ? '°F' : '°C', full: '--.-' };
  const st = hasTemp ? statusOf(curC) : { label: 'Ready to measure', color: 'var(--brand)', hex: currentThemeObj().accent, mercury: `linear-gradient(90deg, #6EE7B7 0%, ${currentThemeObj().accent} 100%)` };
  const fillPct = hasTemp ? Math.max(14, Math.min(96, ((curC - 35.5) / 5.7) * 100)) : 6;

  const lastMed = c.entries.find(e => e.type === 'med');
  const lastMore = c.entries.find(e => !['temp', 'med', 'water'].includes(e.type));
  const waters = c.entries.filter(e => e.type === 'water');
  const waterMl = waters.reduce((s, w) => s + (w.ml || 0), 0);
  const targetMl = dailyWaterGoalMl(c.age, c.weightKg);
  const waterPct = Math.round((waterMl / targetMl) * 100);
  const waterWavePct = Math.min(100, waterPct);
  const overWater = waterMl > targetMl;
  const showAuthor = isFamilyChild(c);
  const list = state.showAll ? c.entries : c.entries.slice(0, 4);

  return `
    <div class="pt-5 px-4 pb-28 space-y-4">
      <div class="flex items-center justify-between">
        <button onclick="openSheet('child')" class="glass-card px-3.5 py-2 rounded-full flex items-center gap-2 text-xs font-bold cursor-pointer">
          <span class="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background: var(--brand);">${esc(c.name[0])}</span>
          <span>${esc(c.name)} · ${fmtW(c.weightKg)} ▾</span>
        </button>
        <div class="flex items-center gap-2">
          <button onclick="openSheet('themes')" title="Themes" class="glass-card w-9 h-9 rounded-full flex items-center justify-center cursor-pointer" style="color: var(--brand);">${ICONS.palette}</button>
          <button onclick="openSheet('sos')" class="h-9 px-3.5 rounded-full text-xs font-bold text-white cursor-pointer" style="background: #DC3E55;">SOS</button>
        </div>
      </div>

      <!-- FLOATING GLASS THERMOMETER CARD -->
      <div class="glass-card rounded-[34px] p-5 relative overflow-hidden">
        <div class="pointer-events-none absolute -top-12 -right-10 w-44 h-44 rounded-full opacity-20 blur-2xl" style="background: ${st.hex};"></div>

        <div class="relative z-10 text-center">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold mb-2" style="background: var(--soft); color: ${st.color};">
            <span class="w-2 h-2 rounded-full" style="background: ${st.hex};"></span>
            <span>${st.label}${latest ? ` · ${esc(latest.time)}` : ''}</span>
          </div>

          <div class="flex items-baseline justify-center tabular font-bold leading-none mt-1" style="color: var(--ink);">
            <span class="text-[60px] tracking-[-0.04em]">${t.w}</span>
            <span class="text-[28px] font-semibold opacity-75">.${t.d}${t.u}</span>
          </div>

          <div class="text-xs mt-1.5 tabular" style="color: var(--muted);">
            ${peakC !== null ? `Peak today <strong style="color: var(--ink);">${fmtT(peakC).full}</strong>` : 'Tap below to record first temperature'}
          </div>
        </div>

        <!-- Display-Only Sleek Horizontal Glass-Bulb Thermometer -->
        <div class="relative z-10 w-full mt-5 mb-5 px-1">
          <div class="flex items-center">
            <div class="mini-thermo-bulb" style="background: ${st.hex};"></div>
            <div class="flex-1 h-4 -ml-2 pl-2.5 pr-1.5 rounded-r-full flex items-center relative overflow-hidden" style="background: var(--soft); border: 1px solid var(--border);">
              <div class="h-2 rounded-full transition-all" style="width: ${fillPct.toFixed(1)}%; background: ${st.mercury};"></div>
            </div>
          </div>
          <div class="flex justify-between text-xs mt-1.5 pl-6 pr-1 tabular" style="color: var(--muted);">
            <span>${state.unit === 'imperial' ? '96°' : '35.5°'}</span>
            <span style="color: var(--warn); font-weight: 700;">${state.unit === 'imperial' ? '100.4°' : '38.0°'}</span>
            <span>${state.unit === 'imperial' ? '106°' : '41.2°'}</span>
          </div>
        </div>

        <button onclick="openSheet('temp')" class="relative z-10 w-full py-3.5 rounded-full text-sm font-bold flex items-center justify-center gap-2 cursor-pointer active:scale-[0.98] transition shadow-sm" style="background: var(--cta-bg); color: var(--cta-ink);">
          ${ICONS.today}
          <span>Take Temperature</span>
        </button>
      </div>

      <!-- 2 TACTILE CARDS: Medicine & Water (Always Pure Aqua) -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="openSheet('med')" class="glass-card rounded-[28px] p-4 text-left cursor-pointer flex flex-col justify-between min-h-[120px]">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold" style="color: var(--muted);">Medicine</span>
            <span class="w-8 h-8 rounded-2xl flex items-center justify-center" style="background: var(--med-soft); color: var(--med);">${ICONS.pill}</span>
          </div>
          <div class="mt-2">
            <div class="text-base font-bold truncate" style="color: var(--ink);">${lastMed ? esc(lastMed.title) : 'Log med'}</div>
            <div class="text-xs mt-0.5 tabular" style="color: var(--muted);">${lastMed ? `${esc(lastMed.dose ? lastMed.dose + ' · ' : '')}${esc(lastMed.time)}` : 'Tap to write'}</div>
          </div>
        </button>

        <button onclick="openSheet('water')" class="glass-card rounded-[28px] p-4 text-left cursor-pointer relative overflow-hidden flex flex-col justify-between min-h-[120px]">
          <div class="pointer-events-none absolute inset-x-0 bottom-0 transition-all duration-300" style="height: ${waterMl > 0 ? Math.max(18, waterWavePct) : 6}%; background: var(--water-fill); border-top: 1.5px solid rgba(14, 165, 233, 0.28);"></div>
          <div class="relative z-10 flex items-center justify-between">
            <span class="text-xs font-semibold" style="color: var(--muted);">Water</span>
            <span class="w-8 h-8 rounded-2xl flex items-center justify-center" style="background: var(--water-soft); color: var(--water);">${ICONS.drop}</span>
          </div>
          <div class="relative z-10 mt-2">
            <div class="text-base font-bold tabular" style="color: var(--ink);">${fmtMl(waterMl)}</div>
            <div class="text-xs mt-0.5 tabular font-semibold" style="color: ${overWater ? 'var(--warn)' : 'var(--water)'};">${overWater ? `${waterPct}% · Over norm` : `${waterPct}% of ${fmtMl(targetMl)}`}</div>
          </div>
        </button>
      </div>

      <!-- CLEAN HEALTH & NOTES LAUNCHER (keeps Home uncluttered!) -->
      <button onclick="openSheet('more')" class="w-full glass-card rounded-[26px] px-4 py-3.5 text-left cursor-pointer flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <span class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0" style="background: var(--brand-soft); color: var(--brand);">${ICONS.note}</span>
          <div class="min-w-0">
            <div class="text-sm font-bold truncate" style="color: var(--ink);">Health &amp; Notes</div>
            <div class="text-xs truncate mt-0.5" style="color: var(--muted);">${lastMore ? `${describeEntry(lastMore, false).title} · ${esc(lastMore.time)}` : 'Skin, sleep, food, diaper, breathing, pulse, custom'}</div>
          </div>
        </div>
        <span class="px-3 py-1.5 rounded-full text-xs font-bold shrink-0" style="background: var(--soft); color: var(--brand);">+ Log</span>
      </button>

      <!-- Today List -->
      <div class="glass-card rounded-[28px] overflow-hidden">
        <div class="flex items-center justify-between px-4 pt-4 pb-2">
          <h3 class="text-sm font-bold" style="color: var(--ink);">Today</h3>
          ${tList.length ? `<button onclick="switchTab('chart')" class="text-xs font-semibold cursor-pointer" style="color: var(--brand);">View curve</button>` : ''}
        </div>
        ${list.length ? `
          <div class="pb-1">
            ${list.map(e => {
              const info = describeEntry(e, showAuthor);
              return `
                <button onclick="openDetail('${esc(e.id)}')" class="w-full flex items-center gap-3 px-4 py-3 text-left cursor-pointer hover:opacity-90">
                  <span class="w-10 h-10 rounded-2xl flex items-center justify-center text-white shrink-0" style="background: ${info.bg};">${info.icon}</span>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm font-semibold truncate" style="color: var(--ink);">${info.title}</div>
                    <div class="text-xs truncate" style="color: var(--muted);">${info.sub}</div>
                  </div>

                    <div class="text-sm font-bold tabular" style="color: ${info.valColor};">${info.val}</div>
                  </div>
                </button>`;
            }).join('')}
          </div>

            <button onclick="state.showAll=!state.showAll; render();" class="w-full py-3 text-xs font-semibold cursor-pointer" style="color: var(--brand);">

      </div>
    </div>`;
}

function renderChart() {
  const c = child();
  if (!c) return renderEmptyChildPrompt();
  const tList = temps(c).slice().reverse();
  const hasT = tList.length > 0;
  const peak = hasT ? Math.max(...tList.map(x => x.tempC)) : null;
  const W = 310, H = 150, pL = 12, pR = 54, pT = 18, pB = 20;
  const yOf = v => pT + (1 - (Math.max(36.2, Math.min(40.2, v)) - 36.2) / 4.0) * (H - pT - pB);
  const pts = tList.map((t, i) => ({ x: pL + (tList.length > 1 ? i / (tList.length - 1) : 0.5) * (W - pL - pR), y: yOf(t.tempC), t }));
  let d = pts.length ? `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}` : '';
  for (let i = 1; i < pts.length; i++) {
    const cx = (pts[i - 1].x + pts[i].x) / 2;
    d += ` C ${cx.toFixed(1)} ${pts[i - 1].y.toFixed(1)}, ${cx.toFixed(1)} ${pts[i].y.toFixed(1)}, ${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)}`;
  }
  const area = pts.length > 1 ? `${d} L ${pts[pts.length - 1].x.toFixed(1)} ${H - pB} L ${pts[0].x.toFixed(1)} ${H - pB} Z` : '';

  return `
    <div class="pt-6 px-4 pb-28 space-y-4">
      <div class="px-1">
        <h2 class="text-2xl font-bold" style="color: var(--ink);">Temperature Curve</h2>
        <p class="text-xs mt-0.5" style="color: var(--muted);">${esc(c.name)}${peak !== null ? ` · Peak ${fmtT(peak).full}` : ''}</p>
      </div>
      <div class="glass-card rounded-[28px] p-4">
        ${hasT ? `
          <div class="flex items-center justify-between mb-3">
            <span class="text-lg font-bold tabular">${fmtT(peak).full} <span class="text-xs font-normal" style="color: var(--muted);">peak</span></span>
            <span class="px-2.5 py-1 rounded-full text-xs font-semibold" style="background: var(--brand-soft); color: var(--brand);">${tList.length} ${tList.length === 1 ? 'reading' : 'readings'}</span>
          </div>
          <svg viewBox="0 0 ${W} ${H}" class="w-full h-[160px] overflow-visible">
            <defs>
              <linearGradient id="gSimple" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--brand)" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <line x1="${pL}" y1="${yOf(38).toFixed(1)}" x2="${W - pR}" y2="${yOf(38).toFixed(1)}" stroke="#D97706" stroke-opacity="0.5" stroke-dasharray="4 4"/>
            <text x="${W - 4}" y="${(yOf(39.5) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)">${state.unit==='imperial'?'103°':'39.5°'}</text>
            <text x="${W - 4}" y="${(yOf(38.0) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="#D97706">${state.unit==='imperial'?'100°':'38.0°'}</text>
            <text x="${W - 4}" y="${(yOf(36.5) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)">${state.unit==='imperial'?'98°':'36.5°'}</text>
            ${area ? `<path d="${area}" fill="url(#gSimple)"/>` : ''}
            ${pts.length > 1 ? `<path d="${d}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/>` : ''}
            ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${statusOf(p.t.tempC).hex}" stroke="var(--card-solid)" stroke-width="2"/>`).join('')}
          </svg>`
        : `<div class="py-10 text-center space-y-2">
            <div class="text-sm font-bold" style="color: var(--ink);">No temperature data yet</div>
            <p class="text-xs" style="color: var(--muted);">Log a temperature reading to plot ${esc(c.name)}'s curve.</p>
          </div>`}
      </div>
      ${(() => {
        const pList = c.entries.filter(e => e.type === 'pulse').slice().reverse();
        if (!pList.length) return '';
        const pMax = Math.max(...pList.map(x => x.bpm));
        const pMin = Math.min(...pList.map(x => x.bpm));
        const yMin = Math.max(50, Math.min(70, pMin - 10));
        const yMax = Math.min(200, Math.max(150, pMax + 10));
        const pY = v => pT + (1 - (v - yMin) / Math.max(1, yMax - yMin)) * (H - pT - pB);
        const pPts = pList.map((p, i) => ({ x: pL + (pList.length > 1 ? i / (pList.length - 1) : 0.5) * (W - pL - pR), y: pY(p.bpm), p }));
        let pd = `M ${pPts[0].x.toFixed(1)} ${pPts[0].y.toFixed(1)}`;
        for (let i = 1; i < pPts.length; i++) {
          const cx = (pPts[i - 1].x + pPts[i].x) / 2;
          pd += ` C ${cx.toFixed(1)} ${pPts[i - 1].y.toFixed(1)}, ${cx.toFixed(1)} ${pPts[i].y.toFixed(1)}, ${pPts[i].x.toFixed(1)} ${pPts[i].y.toFixed(1)}`;
        }
        return `
          <div class="glass-card rounded-[28px] p-4">
            <div class="flex items-center justify-between mb-3">
              <span class="text-sm font-bold" style="color: var(--ink);">Pulse Trend · <span class="tabular" style="color:#E11D48;">${pList[pList.length - 1].bpm} bpm</span></span>
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold" style="background: rgba(225,29,72,0.12); color: #E11D48;">${pList.length} ${pList.length === 1 ? 'reading' : 'readings'}</span>
            </div>
            <svg viewBox="0 0 ${W} ${H}" class="w-full h-[140px] overflow-visible">
              <text x="${W - 4}" y="${(pY(yMax) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${yMax}</text>
              <text x="${W - 4}" y="${(pY(Math.round((yMin + yMax)/2)) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round((yMin + yMax)/2)}</text>
              <text x="${W - 4}" y="${(pY(yMin) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${yMin}</text>
              ${pPts.length > 1 ? `<path d="${pd}" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>` : ''}
              ${pPts.map(pt => `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="4.5" fill="#E11D48" stroke="var(--card-solid)" stroke-width="2"/>`).join('')}
            </svg>
          </div>`;
      })()}
    </div>`;
}

function buildSummaryText(c) {
  const tList = temps(c);
  const meds = c.entries.filter(e => e.type === 'med');
  const notes = c.entries.filter(e => e.type === 'note');
  const waters = c.entries.filter(e => e.type === 'water');
  const latest = tList[0] || null;
  const peakEntry = tList.length ? tList.reduce((a, b) => (b.tempC > a.tempC ? b : a), tList[0]) : null;
  const waterMl = waters.reduce((s, w) => s + (w.ml || 0), 0);
  const diapers = countDiapers(c);
  const targetMl = dailyWaterGoalMl(c.age, c.weightKg);
  const waterPct = Math.round((waterMl / targetMl) * 100);
  const showAuthor = isFamilyChild(c);

  const lines = [
    `NestNote Clinical Handover Summary`,
    `Generated: ${new Date().toLocaleString()}`,
    `Child: ${c.name}, ${c.age} yr, ${fmtW(c.weightKg)}`,
    `Allergies: ${c.allergies || 'None'}`,
    ...(c.doctor ? [`Pediatrician: ${c.doctor}`] : []),
    `Latest Temperature: ${latest ? `${fmtT(latest.tempC).full} (${statusOf(latest.tempC).label}) at ${latest.time}` : 'None'}`,
    `Peak Temperature: ${peakEntry ? `${fmtT(peakEntry.tempC).full} at ${peakEntry.time}` : 'None'}`,
    `Medicines Given: ${meds.length ? meds.map(m => `${m.title}${m.dose ? ' ' + m.dose : ''} (${m.time}${showAuthor && m.author ? ', by ' + m.author : ''})`).join(', ') : 'None'}`,
    `Fluids Today: ${fmtMl(waterMl)} (${waterPct}% of ${fmtMl(targetMl)} daily goal for ${c.age} yr${waterPct > 100 ? ' — over daily norm' : ''}) · ${diapers.wet} wet, ${diapers.stool} stool`,
    ...(notes.length ? [`Skin & Notes: ${notes.map(n => `${n.time} ${[].concat(n.skin || [], n.comment ? [n.comment] : []).join(' — ')}`).join('; ')}`] : []),
    ``,
    `Full Timeline (${c.entries.length} entries):`
  ];
  c.entries.forEach(e => {
    const byStr = (showAuthor && e.author) ? ` · by ${e.author}` : '';
    const cmt = e.comment ? ` · Comment: ${e.comment}` : '';
    const ph = e.photo ? ' [photo attached]' : '';
    if (e.type === 'temp') lines.push(`- ${e.time} | Temp: ${fmtT(e.tempC).full} (${e.note || statusOf(e.tempC).label})${cmt}${ph}${byStr}`);
    else if (e.type === 'med') lines.push(`- ${e.time} | Medicine: ${e.title}${e.dose ? ' · ' + e.dose : ''}${e.note ? ' (' + e.note + ')' : ''}${cmt}${ph}${byStr}`);
    else if (e.type === 'water') lines.push(`- ${e.time} | Fluids: +${fmtMl(e.ml)} ${e.title || 'Water'}${e.wet ? ' · Wet diaper' : ''}${cmt}${ph}${byStr}`);
    else if (e.type === 'note') lines.push(`- ${e.time} | ${[(e.skin && e.skin.length) ? 'Skin: ' + e.skin.join(', ') : '', e.comment].filter(Boolean).join(' · ')}${ph}${byStr}`);
    else if (e.type === 'sleep') lines.push(`- ${e.time} | Sleep: ${fmtHours(e.hours || 0)} (${e.quality || 'Calm'})${cmt}${ph}${byStr}`);
    else if (e.type === 'food') lines.push(`- ${e.time} | Food: ${e.quality || 'Ate well'}${e.title ? ' — ' + e.title : ''}${cmt}${ph}${byStr}`);
    else if (e.type === 'diaper') lines.push(`- ${e.time} | Diaper: ${e.diaperType}${e.diaperType !== 'wet' && e.stool ? ' (' + e.stool + ')' : ''}${cmt}${ph}${byStr}`);
    else if (e.type === 'breathing') lines.push(`- ${e.time} | Breathing: ${(e.breathingTags || []).join(', ') || 'Checked'}${e.respRate ? ' · ' + e.respRate + ' breaths/min' : ''}${cmt}${ph}${byStr}`);
    else if (e.type === 'pulse') lines.push(`- ${e.time} | Pulse: ${e.bpm} bpm${cmt}${ph}${byStr}`);
    else lines.push(`- ${e.time} | ${e.customName}: ${e.customVal}${e.customUnit ? ' ' + e.customUnit : ''}${cmt}${ph}${byStr}`);
  });
  return lines.join('\n');
}

// ==================== BOTTOM SHEETS ====================
let sheet = null;
let detailId = null;
let syncLive = false;
let pendingRender = false;
let syncSource = null;
let syncReconnectTimer = null;

function waterBudget(c) {
  const goalMl = c ? dailyWaterGoalMl(c.age, c.weightKg) : 1200;
  const todayMl = c ? c.entries.filter(e => e.type === 'water').reduce((s, w) => s + (w.ml || 0), 0) : 0;
  const pct = Math.round((todayMl / goalMl) * 100);
  return { goalMl, todayMl, pct, over: todayMl > goalMl };
}

function openSheet(name) {
  sheet = name;
  draft.comment = '';
  draft.photo = '';
  if (name === 'temp') {
    const t = temps(child())[0];
    draft.tempC = t ? t.tempC : 37.0;
  }
  if (name === 'med') draft.medName = '';
  if (name === 'water') {
    if (!draft.ml || draft.ml < 5) draft.ml = 120;
  }
  if (name === 'note') {
    draft.skinSelected = [];
    draft.skinCustom = '';
  }
  if (name === 'sleep') {
    draft.sleepHours = 1.5;
    draft.sleepQuality = 'Calm';
  }
  if (name === 'food') {
    draft.foodAppetite = 'Ate well';
    draft.foodText = '';
  }
  if (name === 'diaper') {
    draft.diaperType = 'wet';
    draft.stool = 'Normal';
  }
  if (name === 'breathing') {
    draft.breathingTags = [];
    draft.respRate = 0;
  }
  if (name === 'pulse') {
    const lp = child()?.entries.find(e => e.type === 'pulse');
    draft.bpm = lp ? lp.bpm : 95;
  }
  if (name === 'custom') {
    draft.customName = '';
    draft.customVal = '';
    draft.customUnit = '';
  }
  renderSheet();
  document.getElementById('sheetBg').classList.add('open');
}

function toggleSkinOption(idx) {
  const opt = SKIN_OPTIONS[idx];
  if (!opt) return;
  const i = draft.skinSelected.indexOf(opt);
  if (i >= 0) draft.skinSelected.splice(i, 1);
  else draft.skinSelected.push(opt);
  renderSheet();
}

function toggleBreathingOption(idx) {
  const opt = BREATHING_OPTIONS[idx];
  if (!opt) return;
  const i = draft.breathingTags.indexOf(opt);
  if (i >= 0) draft.breathingTags.splice(i, 1);
  else draft.breathingTags.push(opt);
  renderSheet();
}

function pickCustomPreset(idx) {
  const list = savedCustomMetricNames(child());
  const item = list[idx];
  if (!item) return;
  draft.customName = item.name;
  draft.customUnit = item.unit || '';
  renderSheet();
}
function openDetail(id) { detailId = id; openSheet('detail'); }
function closeSheet() {
  document.getElementById('sheetBg').classList.remove('open');
  sheet = null;
  if (pendingRender) {
    pendingRender = false;
    render();
  }
}

function updateThermoFromPointer(clientX) {
  const cap = document.getElementById('thermoCapillary');
  if (!cap) return;
  const r = cap.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  draft.tempC = +(35.5 + ratio * (41.2 - 35.5)).toFixed(1);
  renderSheet();
}

function startThermoDrag(e) {
  updateThermoFromPointer(e.clientX);
  const move = ev => updateThermoFromPointer(ev.clientX);
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function waterLabelOf(ml) {
  if (ml <= 45) return 'Small sip';
  if (ml <= 115) return 'Half cup';
  if (ml <= 230) return 'Full cup';
  if (ml <= 360) return 'Bottle';
  return 'Large bottle';
}

function updateWaterFromPointer(clientX) {
  const cap = document.getElementById('waterCapillary');
  if (!cap) return;
  const r = cap.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  draft.ml = Math.max(10, Math.min(500, Math.round((10 + ratio * 490) / 5) * 5));
  renderSheet();
}

function startWaterDrag(e) {
  updateWaterFromPointer(e.clientX);
  const move = ev => updateWaterFromPointer(ev.clientX);
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function nowHHMM() { const n = new Date(); return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; }

function switchAuthMode(m) {
  state.authMode = m;
  authForm.error = '';
  authForm.badFields.clear();
  render();
}

async function submitAuth() {
  if (state.busy) return;
  const isUp = state.authMode === 'signup';
  authForm.name = (document.getElementById('authName')?.value ?? authForm.name).trim();
  authForm.user = (document.getElementById('authUser')?.value ?? authForm.user).trim();
  authForm.pass = (document.getElementById('authPass')?.value ?? authForm.pass);
  authForm.badFields.clear();
  authForm.error = '';

  if (isUp && !authForm.name) authForm.badFields.add('name');
  if (!authForm.user) authForm.badFields.add('user');
  if (!authForm.pass) authForm.badFields.add('pass');

  if (authForm.badFields.size > 0) {
    authForm.error = isUp
      ? 'Please fill in your name, email/username, and password.'
      : 'Please enter both your email/username and password.';
    render();
    return;
  }
  if (isUp && authForm.pass.length < 6) {
    authForm.badFields.add('pass');
    authForm.error = 'Password must be at least 6 characters.';
    render();
    return;
  }

  state.busy = true;
  render();

  const finishLocalAuth = async () => {
    const loc = isUp
      ? await localRegister({ name: authForm.name, username: authForm.user, password: authForm.pass })
      : await localLogin({ username: authForm.user, password: authForm.pass });
    if (!loc.ok) {
      authForm.error = loc.message || (isUp ? 'Could not create account.' : 'Invalid email/username or password');
      state.busy = false;
      render();
      return;
    }
    state.token = '';
    state.localUser = loc.user.username;
    state.userName = loc.user.name;
    state.theme = validThemeId(loc.user.theme || state.theme);
    state.unit = loc.user.unit || state.unit;
    state.alarmOn = loc.user.alarmOn !== undefined ? loc.user.alarmOn : state.alarmOn;
    state.children = Array.isArray(loc.children) ? loc.children : [];
    state.childId = (loc.user.childId && state.children.some(x => x.id === loc.user.childId))
      ? loc.user.childId
      : (state.children[0]?.id || null);
    state.signedIn = true;
    state.isGuest = false;
    state.busy = false;
    authForm.pass = '';
    authForm.error = '';
    state.view = state.children.length ? 'app' : 'childSetup';
    persist();
    render();
    toast(state.children.length ? `Welcome back, ${state.userName}` : 'Step 2: Add your child');
  };

  try {
    const endpoint = isUp ? '/api/register' : '/api/login';
    const payload = isUp
      ? { name: authForm.name, username: authForm.user, password: authForm.pass }
      : { username: authForm.user, password: authForm.pass };
    const r = await apiCall('POST', endpoint, payload);

    // If hosted on a static host (GitHub Pages / Render Static Site) or backend is offline, use local account store seamlessly
    if (!r.isApiJson) {
      await finishLocalAuth();
      return;
    }

    if (!r.ok || !r.data) {
      authForm.error = r.message || (isUp ? 'Could not create account. Please check your details.' : 'Invalid email/username or password.');
      state.busy = false;
      render();
      return;
    }

    state.token = r.data.token;
    state.localUser = '';
    state.userName = r.data.user?.name || authForm.name || authForm.user.split('@')[0];
    state.theme = validThemeId(r.data.user?.theme || state.theme);
    if (r.data.user?.unit === 'metric' || r.data.user?.unit === 'imperial') state.unit = r.data.user.unit;
    if (typeof r.data.user?.alarmOn === 'boolean') state.alarmOn = r.data.user.alarmOn;
    state.children = (r.data.children || []).map(normalizeServerChild);
    state.childId = state.children[0]?.id || null;
    state.signedIn = true;
    state.isGuest = false;
    state.busy = false;
    authForm.pass = '';
    authForm.error = '';
    state.view = state.children.length ? 'app' : 'childSetup';
    persist();
    connectSyncStream();
    render();
    toast(state.children.length ? `Welcome back, ${state.userName}` : 'Step 2: Add your child');
  } catch {
    await finishLocalAuth();
  }
}

function enterGuest() {
  disconnectSyncStream();
  state.token = '';
  state.localUser = '';
  state.userName = 'Guest';
  state.isGuest = true;
  state.signedIn = true;
  state.view = state.children.length ? 'app' : 'childSetup';
  persist();
  render();
}

async function signOut() {
  disconnectSyncStream();
  if (state.token) {
    apiCall('POST', '/api/logout').catch(() => {});
  }
  state.token = '';
  state.localUser = '';
  state.signedIn = false;
  state.isGuest = false;
  state.userName = '';
  state.children = [];
  state.childId = null;
  state.view = 'auth';
  authForm.pass = '';
  authForm.error = '';
  persist();
  render();
}

async function submitChildSetup() {
  if (state.busy) return;
  setupForm.name = (document.getElementById('setupChildName')?.value ?? setupForm.name).trim();
  setupForm.age = (document.getElementById('setupChildAge')?.value ?? setupForm.age).trim();
  setupForm.weight = (document.getElementById('setupChildWeight')?.value ?? setupForm.weight).trim();
  setupForm.allergies = (document.getElementById('setupChildAllergies')?.value ?? setupForm.allergies).trim();
  setupForm.doctor = (document.getElementById('setupChildDoctor')?.value ?? setupForm.doctor).trim();
  setupForm.badFields.clear();
  setupForm.error = '';

  const age = parseFloat(setupForm.age);
  const rawW = parseFloat(setupForm.weight);

  if (!setupForm.name) setupForm.badFields.add('name');
  if (!(age > 0)) setupForm.badFields.add('age');
  if (!(rawW > 0)) setupForm.badFields.add('weight');

  if (setupForm.badFields.size > 0) {
    setupForm.error = "Please enter your child's name, age, and weight.";
    render();
    return;
  }

  const kg = state.unit === 'imperial' ? +(rawW / 2.20462).toFixed(1) : rawW;

  if (state.token) {
    state.busy = true;
    render();
    try {
      const r = await apiCall('POST', '/api/children', {
        name: setupForm.name,
        age,
        weight: kg,
        allergies: setupForm.allergies || 'None',
        doctorPhone: setupForm.doctor || ''
      });
      state.busy = false;
      if (!r.ok || !r.data) {
        setupForm.error = r.message || 'Could not save child profile.';
        render();
        return;
      }
      const created = normalizeServerChild(r.data);
      state.children.unshift(created);
      state.childId = created.id;
    } catch {
      state.busy = false;
      setupForm.error = 'Connection error. Please try again.';
      render();
      return;
    }
  } else {
    const id = 'c' + Date.now();
    state.children.unshift({
      id, name: setupForm.name, age, weightKg: kg, allergies: setupForm.allergies || 'None',
      doctor: setupForm.doctor || '', familyCode: generateFamilyCode(), familyMembers: [], reminders: [], entries: []
    });
    state.childId = id;
  }

  setupForm.name = ''; setupForm.age = ''; setupForm.weight = ''; setupForm.allergies = ''; setupForm.doctor = '';
  state.view = 'app';
  state.tab = 'today';
  persist();
  render();
  toast(`Welcome to NestNote · ${child().name} added`);
}

function encodeSharePayload(c) {
  const mini = {
    v: 1,
    n: c.name,
    a: c.age,
    w: c.weightKg,
    al: c.allergies || 'None',
    dr: c.doctor || '',
    fc: c.familyCode || state.familyCode,
    r: (c.reminders || []).slice(0, 30).map(x => [x.id, x.text, x.when, x.done ? 1 : 0]),
    e: (c.entries || []).slice(0, 40).map(x =>
      x.type === 'temp' ? ['t', x.id, x.tempC, x.time, x.note || '', x.createdAtMs || 0, x.comment || '']
      : x.type === 'med' ? ['m', x.id, x.title, x.dose || '', x.time, x.note || '', x.createdAtMs || 0, x.comment || '']
      : x.type === 'note' ? ['n', x.id, x.skin || [], x.comment || '', x.time, x.createdAtMs || 0]
      : x.type === 'sleep' ? ['s', x.id, x.hours || 0, x.quality || 'Calm', x.time, x.createdAtMs || 0, x.comment || '']
      : x.type === 'food' ? ['f', x.id, x.quality || 'Ate well', x.title || '', x.time, x.createdAtMs || 0, x.comment || '']
      : x.type === 'diaper' ? ['d', x.id, x.diaperType || 'wet', x.stool || '', x.time, x.createdAtMs || 0, x.comment || '']
      : x.type === 'breathing' ? ['b', x.id, x.breathingTags || [], x.respRate || 0, x.time, x.createdAtMs || 0, x.comment || '']
      : x.type === 'pulse' ? ['p', x.id, x.bpm || 95, x.time, x.createdAtMs || 0, x.comment || '']
      : x.type === 'custom' ? ['c', x.id, x.customName || '', x.customVal || '', x.customUnit || '', x.time, x.createdAtMs || 0, x.comment || '']
      : ['w', x.id, x.ml || 0, x.wet ? 1 : 0, x.time, x.createdAtMs || 0, x.comment || '']
    )
  };
  const bytes = new TextEncoder().encode(JSON.stringify(mini));
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeSharePayload(raw) {
  let token = String(raw || '').trim();
  const hashIdx = token.indexOf('#sync=');
  if (hashIdx >= 0) token = token.slice(hashIdx + 6);
  if (token.toUpperCase().startsWith('NESTSYNC:')) token = token.slice(9).trim();
  token = token.replace(/-/g, '+').replace(/_/g, '/');
  while (token.length % 4) token += '=';
  const bin = atob(token);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const mini = JSON.parse(new TextDecoder().decode(bytes));
  if (!mini || !mini.n) throw new Error('Invalid share link');
  return {
    id: 'c_sync_' + (mini.fc || Date.now()),
    name: String(mini.n),
    age: Number(mini.a) || 1,
    weightKg: Number(mini.w) || 10,
    allergies: mini.al || 'None',
    doctor: mini.dr || '',
    familyCode: mini.fc || generateFamilyCode(),
    familyMembers: [],
    reminders: (mini.r || []).map(x => ({ id: x[0], text: x[1], when: x[2] || 'Today', done: !!x[3] })),
    entries: (mini.e || []).map(x => {
      if (x[0] === 't') return { id: x[1], type: 'temp', tempC: Number(x[2]), time: x[3], note: x[4], createdAtMs: Number(x[5]) || 0, comment: x[6] || '' };
      if (x[0] === 'm') return { id: x[1], type: 'med', title: x[2], dose: x[3], time: x[4], note: x[5], createdAtMs: Number(x[6]) || 0, comment: x[7] || '' };
      if (x[0] === 'n') return { id: x[1], type: 'note', skin: Array.isArray(x[2]) ? x[2] : [], comment: x[3] || '', time: x[4], createdAtMs: Number(x[5]) || 0 };
      if (x[0] === 's') return { id: x[1], type: 'sleep', hours: Number(x[2]) || 0, quality: x[3] || 'Calm', time: x[4], createdAtMs: Number(x[5]) || 0, comment: x[6] || '' };
      if (x[0] === 'f') return { id: x[1], type: 'food', quality: x[2] || 'Ate well', title: x[3] || '', time: x[4], createdAtMs: Number(x[5]) || 0, comment: x[6] || '' };
      if (x[0] === 'd') return { id: x[1], type: 'diaper', diaperType: x[2] || 'wet', stool: x[3] || '', time: x[4], createdAtMs: Number(x[5]) || 0, comment: x[6] || '' };
      if (x[0] === 'b') return { id: x[1], type: 'breathing', breathingTags: Array.isArray(x[2]) ? x[2] : [], respRate: Number(x[3]) || null, time: x[4], createdAtMs: Number(x[5]) || 0, comment: x[6] || '' };
      if (x[0] === 'p') return { id: x[1], type: 'pulse', bpm: Number(x[2]) || 95, time: x[3], createdAtMs: Number(x[4]) || 0, comment: x[5] || '' };
      if (x[0] === 'c') return { id: x[1], type: 'custom', customName: x[2] || '', customVal: x[3] || '', customUnit: x[4] || '', time: x[5], createdAtMs: Number(x[6]) || 0, comment: x[7] || '' };
      return { id: x[1], type: 'water', title: 'Water', ml: Number(x[2]) || 0, wet: !!x[3], time: x[4], createdAtMs: Number(x[5]) || 0, comment: x[6] || '' };
    })
  };
}

function mergeImportedChild(imported) {
  const existing = state.children.find(x => (imported.familyCode && x.familyCode === imported.familyCode) || x.id === imported.id);
  if (existing) {
    existing.name = imported.name;
    existing.age = imported.age;
    existing.weightKg = imported.weightKg;
    existing.allergies = imported.allergies;
    existing.doctor = imported.doctor;
    const entryMap = new Map();
    [...existing.entries, ...imported.entries].forEach(e => entryMap.set(e.id, e));
    existing.entries = Array.from(entryMap.values()).sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
    const remMap = new Map();
    [...existing.reminders, ...imported.reminders].forEach(r => remMap.set(r.id, r));
    existing.reminders = Array.from(remMap.values());
    state.childId = existing.id;
    return existing;
  }
  state.children.unshift(imported);
  state.childId = imported.id;
  return imported;
}

async function joinPartnerCode(code, fromSetup) {
  const raw = (code || '').trim();
  if (!raw) {
    if (fromSetup) { setupForm.error = "Paste a partner's share link or Family Code to join."; render(); }
    else toast("Paste a partner's share link or code first");
    return;
  }

  // Support serverless share link / sync code directly on GitHub Pages
  if (raw.includes('#sync=') || raw.toUpperCase().startsWith('NESTSYNC:') || raw.length > 24) {
    try {
      const imported = decodeSharePayload(raw);
      const merged = mergeImportedChild(imported);
      setupForm.error = '';
      setupForm.joinCode = '';
      familyJoinInput = '';
      state.view = 'app';
      state.tab = 'today';
      persist();
      render();
      toast(`Synced ${merged.name}'s diary`);
      return;
    } catch {}
  }

  const clean = raw.toUpperCase();
  if (!state.token) {
    const msg = 'On GitHub Pages, paste the full Share Link copied from your partner\'s Family tab.';
    if (fromSetup) { setupForm.error = msg; render(); }
    else toast(msg);
    return;
  }

  try {
    const r = await apiCall('POST', '/api/family/join', { code: clean });
    if (!r.ok || !r.data) {
      const msg = r.message || 'Family code not found.';
      if (fromSetup) { setupForm.error = msg; render(); }
      else toast(msg);
      return;
    }
    const joined = normalizeServerChild(r.data);
    const idx = state.children.findIndex(x => x.id === joined.id);
    if (idx >= 0) state.children[idx] = joined;
    else state.children.unshift(joined);
    state.childId = joined.id;
    setupForm.error = '';
    setupForm.joinCode = '';
    familyJoinInput = '';
    state.view = 'app';
    state.tab = 'today';
    persist();
    render();
    toast(`Connected to ${joined.name}`);
  } catch {
    toast('Connection error. Please try again.');
  }
}

async function undoDelete() {
  if (!lastDeleted) return;
  const { childId, entry, idx } = lastDeleted;
  lastDeleted = null;
  const c = state.children.find(x => x.id === childId);
  if (!c) return;

  if (state.token) {
    try {
      const payload = {
        ...entry,
        temp: entry.type === 'temp' ? entry.tempC : null,
        createdAtMs: entry.createdAtMs || Date.now()
      };
      const r = await apiCall('POST', `/api/children/${encodeURIComponent(c.id)}/entries`, payload);
      if (r.ok && r.data) {
        c.entries.splice(idx, 0, normalizeServerEntry(r.data));
        persist(); render(); toast('Entry restored');
        return;
      }
    } catch {}
  }

  c.entries.splice(idx, 0, entry);
  persist(); render(); toast('Entry restored');
}

// ==================== BOOTSTRAP & FULL REAL-TIME CO-PARENT SYNC ====================
function disconnectSyncStream() {
  clearTimeout(syncReconnectTimer);
  syncReconnectTimer = null;
  if (syncSource) {
    try { syncSource.close(); } catch {}
    syncSource = null;
  }
  syncLive = false;
}

function connectSyncStream() {
  disconnectSyncStream();
  if (!state.token || typeof EventSource === 'undefined') return;
  try {
    const url = `${API_BASE}/api/stream?token=${encodeURIComponent(state.token)}`;
    const es = new EventSource(url);
    syncSource = es;
    es.onopen = () => {
      syncLive = true;
      if (state.view === 'app' && (state.tab === 'family' || state.tab === 'settings') && !sheet) render();
    };
    es.onmessage = ev => {
      try {
        const msg = JSON.parse(ev.data || '{}');
        if (msg.type === 'connected') {
          syncLive = true;
          return;
        }
        syncFromServer({ force: true });
        if (msg.type === 'family_joined' && msg.member && msg.member !== state.userName) {
          toast(`${msg.member} joined your NestNote family`);
        } else if (msg.type === 'entry_added' && msg.author && msg.author !== state.userName) {
          toast(`New update from ${msg.author}`);
        }
      } catch {}
    };
    es.onerror = () => {
      syncLive = false;
      try { es.close(); } catch {}
      if (syncSource === es) syncSource = null;
      if (state.token) {
        clearTimeout(syncReconnectTimer);
        syncReconnectTimer = setTimeout(connectSyncStream, 4000);
      }
    };
  } catch {}
}

let syncInFlight = false;
async function syncFromServer(opts = {}) {
  if (!state.token || syncInFlight) return;
  if (!opts.force && (state.view !== 'app' || document.hidden)) return;
  syncInFlight = true;
  try {
    const r = await apiCall('GET', '/api/me');
    if (r.ok && r.data) {
      if (r.data.user) {
        state.userName = r.data.user.name || state.userName;
        if (r.data.user.theme) state.theme = validThemeId(r.data.user.theme);
        if (r.data.user.unit === 'metric' || r.data.user.unit === 'imperial') state.unit = r.data.user.unit;
        if (typeof r.data.user.alarmOn === 'boolean') state.alarmOn = r.data.user.alarmOn;
      }
      state.children = (r.data.children || []).map(normalizeServerChild);
      if (state.children.length && !state.children.some(x => x.id === state.childId)) {
        state.childId = state.children[0].id;
      }
      persist();
      const activeTag = document.activeElement?.tagName;
      const userTyping = activeTag === 'INPUT' || activeTag === 'TEXTAREA';
      if (sheet || userTyping) {
        pendingRender = true;
      } else if (state.view === 'app') {
        render();
      }
      if (opts.notify) toast('Synced just now');
    }
  } catch {} finally {
    syncInFlight = false;
  }
}

async function bootApp() {
  render();
  if (API_BASE) fetch(API_BASE + '/api/health').catch(() => {});
  const minSplash = new Promise(resolve => setTimeout(resolve, 1550));

  let nextView = 'auth';
  if (state.token) {
    try {
      const r = await apiCall('GET', '/api/me');
      if (r.ok && r.data) {
        state.userName = r.data.user?.name || state.userName;
        state.theme = validThemeId(r.data.user?.theme || state.theme);
        if (r.data.user?.unit === 'metric' || r.data.user?.unit === 'imperial') state.unit = r.data.user.unit;
        if (typeof r.data.user?.alarmOn === 'boolean') state.alarmOn = r.data.user.alarmOn;
        state.children = (r.data.children || []).map(normalizeServerChild);
        if (state.children.length && !state.children.some(x => x.id === state.childId)) {
          state.childId = state.children[0].id;
        }
        state.signedIn = true;
        state.isGuest = false;
        persist();
        connectSyncStream();
        nextView = state.children.length ? 'app' : 'childSetup';
      } else if (r.status === 401) {
        state.token = '';
        state.signedIn = false;
        persist();
        nextView = 'auth';
      } else {
        nextView = state.signedIn ? (state.children.length ? 'app' : 'childSetup') : 'auth';
      }
    } catch {
      nextView = state.signedIn ? (state.children.length ? 'app' : 'childSetup') : 'auth';
    }
  } else if (state.signedIn && (state.isGuest || state.localUser)) {
    nextView = state.children.length ? 'app' : 'childSetup';
  }

  await minSplash;
  // Auto-import shared diary if opened via a partner #sync= link
  if (window.location.hash && window.location.hash.startsWith('#sync=')) {
    try {
      const imported = decodeSharePayload(window.location.hash);
      const merged = mergeImportedChild(imported);
      state.signedIn = true;
      if (!state.token && !state.localUser) { state.isGuest = true; state.userName = state.userName || 'Parent'; }
      nextView = 'app';
      persist();
      history.replaceState(null, '', window.location.pathname + window.location.search);
      setTimeout(() => toast(`Imported ${merged.name}'s diary`), 200);
    } catch {}
  }
  if (state.view === 'loading') {
    state.view = nextView;
    render();
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.token) {
    syncFromServer({ force: true });
    if (!syncSource) connectSyncStream();
  }
});
window.addEventListener('focus', () => { if (state.token) syncFromServer({ force: true }); });
window.addEventListener('online', () => { if (state.token) { syncFromServer({ force: true }); connectSyncStream(); } });
setInterval(() => syncFromServer(), 6000);
bootApp();
</script>
</body>
